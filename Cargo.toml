[workspace.package]
version = "0.2.0"
edition = "2024"
# `description` is intentionally omitted here: every member crate declares its own.
license = "MIT"
repository = "https://github.com/anomalyco/calxgloss"

[workspace]
resolver = "3"
members = [
    "crates/calxgloss-types",
    "crates/calxgloss-ghidra",
    "crates/calxgloss-llm",
    "crates/calxgloss-analysis",
    "crates/calxgloss-testgen",
    "crates/calxgloss-translator",
    "crates/calxgloss-verify",
    "crates/calxgloss-git",
    "crates/calxgloss-prompts",
    "crates/calxgloss-pal",
    "crates/calxgloss-reports",
    "crates/calxgloss",
    "crates/calxgloss-cli",
    "crates/calxgloss-web",
    "crates/calxgloss-config",
    "crates/calxgloss-callgraph",
    "crates/calxgloss-typesdb",
    "crates/calxgloss-typeinfer",
    "crates/calxgloss-algorithm",
    "crates/calxgloss-memory",
]

[workspace.dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
tokio = { version = "1.53.1", features = ["full"] }
futures-util = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
git2 = "0.21.0"
clap = { version = "4.6.7", features = ["derive"] }
url = "2.5.8"
once_cell = "1.21.4"
chrono = { version = "0.4.45", features = ["serde"] }
parking_lot = "0.12.5"
askama = "0.16.1"
