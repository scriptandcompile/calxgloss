[workspace.package]
version = "0.3.0"
edition = "2024"
# `description` is intentionally omitted here: every member crate declares its own.
license = "MIT"
repository = "https://github.com/anomalyco/calxgloss"

[workspace]
resolver = "3"
# The meta-lib sits at `crates/`; every other crate lives under its context
# directory (pipeline, evidence, integrations, interface, shared — see GLOSSARY-MAP.md).
members = [
    "crates/calxgloss",
    "crates/pipeline/*",
    "crates/evidence/*",
    "crates/integrations/*",
    "crates/interface/*",
    "crates/shared/*",
]

[workspace.dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
tokio = { version = "1.54.0", features = ["full"] }
futures-util = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
git2 = "0.21.0"
clap = { version = "4.6.7", features = ["derive"] }
url = "2.5.8"
sha2 = "0.11.1"
once_cell = "1.21.4"
# PE parsing for the baseline runner's address math and the test-fixture
# shape validation: only the PE readers are needed, nothing else.
goblin = { version = "0.10.7", default-features = false, features = ["pe32", "pe64"] }
chrono = { version = "0.4.45", features = ["serde"] }
parking_lot = "0.12.5"
askama = "0.16.1"
sysinfo = "0.39.6"
# The Kuna decompiler engine (Apache-2.0, https://github.com/Noelo-Lab/kuna),
# pinned to a release tag so a build is reproducible and the upstream contract
# is a published one (ADR-0039). Only the crates the in-process loader needs
# are pinned; `crates/integrations/calxgloss-kuna` consumes them.
kuna-base = { git = "https://github.com/Noelo-Lab/kuna", tag = "v1.878" }
kuna-console = { git = "https://github.com/Noelo-Lab/kuna", tag = "v1.878" }
# The analysis tier (string inventory, xref walk) and the decompiler substrate
# (the interned type factory), which the seam's remaining scan reads answer
# from (issue #207).
kuna-analysis = { git = "https://github.com/Noelo-Lab/kuna", tag = "v1.878" }
kuna-decomp = { git = "https://github.com/Noelo-Lab/kuna", tag = "v1.878" }
# The SLEIGH compiler, used by calxgloss-kuna's build script to compile the
# embedded x86 specs; a build-dependency only.
kuna-slacomp = { git = "https://github.com/Noelo-Lab/kuna", tag = "v1.878" }
# Binary container reader (import/export tables, image base) for the Kuna
# source's seam reads; pinned to the same version Kuna itself depends on, so
# both read the same file through the same lens.
object = { version = "0.39", default-features = false, features = ["read_core", "elf", "pe", "macho", "coff", "std"] }
