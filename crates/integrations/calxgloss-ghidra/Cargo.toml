[package]
name = "calxgloss-ghidra"
version.workspace = true
edition.workspace = true
description = "GhidraMCP HTTP client for pulling disassembly, decompiler output, and symbol data"
license.workspace = true
repository.workspace = true

[dependencies]
calxgloss-types = { path = "../../shared/calxgloss-types" }
reqwest = { workspace = true, features = ["json"] }
sha2 = { workspace = true }
zip = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
tempfile = "3"
# The fixture target binary the Kuna engine tests drive the `drive_all`
# seam harness over; the reachability test below keeps that wiring honest.
calxgloss-testfixtures = { path = "../calxgloss-testfixtures" }
