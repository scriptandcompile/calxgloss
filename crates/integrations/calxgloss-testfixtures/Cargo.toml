[package]
name = "calxgloss-testfixtures"
version.workspace = true
edition.workspace = true
description = "Checked-in test fixtures: small PE target binaries (DLLs and a console EXE) built from source for engine and scenario tests"
license.workspace = true
repository.workspace = true

# `goblin` backs the fixture shape validation the smoke tests and the engine
# test harnesses run on the built DLLs and the console EXE.
[dependencies]
goblin = { workspace = true }
thiserror = { workspace = true }

# The smoke test inspects the plain fixture's import table directly, and the
# console smoke test runs the EXE under Wine in a temp run dir.
[dev-dependencies]
goblin = { workspace = true }
tempfile = "3"
