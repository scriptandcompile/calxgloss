[package]
name = "calxgloss-decomp"
version.workspace = true
edition.workspace = true
description = "Analysis-engine seam: the ScanSource/TypeWriteSource vocabulary, the read cache, and the Kuna-backed implementations"
license.workspace = true
repository.workspace = true

[dependencies]
calxgloss-types = { path = "../../shared/calxgloss-types" }
# The Kuna engine sits behind the ScanSource seam (issue #206). The dependency
# direction is decomp → kuna, never the reverse: the seam trait lives here, so
# a kuna → decomp edge would be a cycle.
calxgloss-kuna = { path = "../calxgloss-kuna" }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
tempfile = "3"
# The fixture target binary the Kuna engine tests drive the `drive_all`
# seam harness over; the reachability test below keeps that wiring honest.
calxgloss-testfixtures = { path = "../calxgloss-testfixtures" }
