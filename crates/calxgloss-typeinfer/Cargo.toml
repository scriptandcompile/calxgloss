[package]
name = "calxgloss-typeinfer"
version.workspace = true
edition.workspace = true
description = "Type inference and propagation: C++ this-pointer detection, parameter size detection, known type propagation"
license.workspace = true
repository.workspace = true

[dependencies]
calxgloss-ghidra = { path = "../calxgloss-ghidra" }
calxgloss-types = { path = "../calxgloss-types" }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }

# `calxgloss-ghidra` and `regex` back the decompiler fetches and pattern
# matching the inference detectors run on; they are declared now so the
# manifest stays stable as the detectors land. Same allowance as
# `calxgloss-typesdb`.
[lints.cargo]
unused_dependencies = "allow"
