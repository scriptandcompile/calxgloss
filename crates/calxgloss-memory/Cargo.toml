[package]
name = "calxgloss-memory"
version.workspace = true
edition.workspace = true
description = "Memory lifecycle and RAII detection: allocation/deallocation pair tracking, handle lifecycle detection, reference counting detection"
license.workspace = true
repository.workspace = true

[dependencies]
calxgloss-ghidra = { path = "../calxgloss-ghidra" }
calxgloss-types = { path = "../calxgloss-types" }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
tempfile = "3"

# `calxgloss-ghidra` and `regex` back the decompiler fetches and the call
# and pattern matching the lifecycle detectors run on; they are declared
# now so the manifest stays stable as the detectors land. Same allowance as
# `calxgloss-typesdb`, `calxgloss-typeinfer`, and `calxgloss-algorithm`.
[lints.cargo]
unused_dependencies = "allow"
