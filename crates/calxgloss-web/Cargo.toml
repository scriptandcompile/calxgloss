[package]
name = "calxgloss-web"
version.workspace = true
edition.workspace = true
description = "Web review UI — scaffolded (implemented post-MVP)"
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { workspace = true }

# --- Optional dependencies (post-MVP) ---
# Enable with: cargo build --features server

axum = { version = "0.8", optional = true }

[features]
default = []
# Enables the axum HTTP server for serving the review dashboard API.
server = ["dep:axum"]
