[package]
name = "calxgloss-web"
version.workspace = true
edition.workspace = true
description = "Web review UI — API layer for the review dashboard"
license.workspace = true
repository.workspace = true

[dependencies]
calxgloss-types = { path = "../calxgloss-types" }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# --- Optional dependencies (post-MVP) ---
# Enable with: cargo build --features server

axum = { version = "0.8", optional = true }
calxgloss-reports = { path = "../calxgloss-reports", optional = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { version = "1.0", features = ["v4"], optional = true }

[features]
default = []
# Enables the axum HTTP server for serving the review dashboard API.
server = [
    "dep:axum",
    "dep:calxgloss-reports",
    "dep:thiserror",
    "dep:tracing",
    "dep:uuid",
]
