[package]
name = "calxgloss-web"
version.workspace = true
edition.workspace = true
description = "Web review UI — API layer for the review dashboard"
license.workspace = true
repository.workspace = true

[dependencies]
calxgloss-types = { path = "../calxgloss-types" }
calxgloss-git = { path = "../calxgloss-git" }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# --- Optional dependencies (post-MVP) ---
# Enable with: cargo build --features server

axum = { version = "0.8", optional = true, features = ["ws"] }
axum-extra = { version = "0.10", optional = true, features = ["erased-json", "query"] }
calxgloss-reports = { path = "../calxgloss-reports", optional = true }
calxgloss-ghidra = { path = "../calxgloss-ghidra", optional = true }
calxgloss-translator = { path = "../calxgloss-translator", optional = true }
calxgloss-verify = { path = "../calxgloss-verify", optional = true }
calxgloss-llm = { path = "../calxgloss-llm", optional = true }
calxgloss-pal = { path = "../calxgloss-pal", optional = true }
git2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { version = "1.0", features = ["v4"], optional = true }
anyhow = { workspace = true, optional = true }

[features]
default = []
# Enables the axum HTTP server for serving the review dashboard API and static frontend.
server = [
    "dep:axum",
    "dep:axum-extra",
    "dep:calxgloss-reports",
    "dep:calxgloss-ghidra",
    "dep:calxgloss-translator",
    "dep:calxgloss-verify",
    "dep:calxgloss-llm",
    "dep:calxgloss-pal",
    "dep:git2",
    "dep:thiserror",
    "dep:tokio",
    "dep:futures-util",
    "dep:tracing",
    "dep:uuid",
    "dep:anyhow",
]

[dev-dependencies]
tempfile = "3"
reqwest = { workspace = true, features = ["json", "stream"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
urlencoding = "2"
# Headless Chrome — only needed for the E2E browser test.
# The test is gated behind #[ignore] because Chrome must be
# installed on the machine.  It is kept here so CI can run it.
headless_chrome = "1.0.18"

[lints.cargo]
unused_dependencies = "allow"
