<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calxgloss — Review Dashboard</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <!-- Top bar -->
    <header id="topbar">
        <div class="topbar-left">
            <button id="sidebar-toggle" class="icon-btn" aria-label="Toggle sidebar">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="4" x2="15" y2="4"/><line x1="3" y1="9" x2="15" y2="9"/><line x1="3" y1="14" x2="15" y2="14"/>
                </svg>
            </button>
            <h1 class="topbar-title">Calxgloss</h1>
        </div>
        <nav id="nav-tabs">
            <button class="nav-tab active" data-view="dashboard">Dashboard</button>
            <button class="nav-tab" data-view="queue">Review Queue</button>
            <button class="nav-tab" data-view="graph">Dependency Graph</button>
        </nav>
        <div class="topbar-right">
            <span id="live-indicator" class="live-dot" title="Live updates active">●</span>
            <button id="btn-refresh" class="icon-btn" aria-label="Refresh data">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M2 8a6 6 0 0 1 10.5-4M14 8a6 6 0 0 1-10.5 4"/>
                    <polyline points="13 1 13 5 9 5"/><polyline points="3 15 3 11 7 11"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Sidebar: Dependency Graph -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <span>Dependency Graph</span>
            <button id="sidebar-close" class="icon-btn" aria-label="Close sidebar">✕</button>
        </div>
        <canvas id="graph-canvas"></canvas>
        <div id="graph-legend" class="graph-legend"></div>
    </aside>

    <!-- Main content area -->
    <main id="main">
        <!-- Dashboard view -->
        <section id="view-dashboard" class="view view-active">
            <!-- Status cards row -->
            <div id="status-cards" class="status-cards"></div>

            <!-- Two-column layout: queue + activity -->
            <div class="dashboard-columns">
                <div class="column queue-column">
                    <div class="column-header">
                        <h2>Review Queue</h2>
                        <span id="queue-count" class="badge"></span>
                    </div>
                    <div id="queue-list" class="queue-list"></div>
                    <div id="queue-empty" class="empty-state" style="display:none">
                        <p>No units pending review.</p>
                    </div>
                </div>
                <div class="column activity-column">
                    <div class="column-header">
                        <h2>Recent Activity</h2>
                    </div>
                    <div id="activity-list" class="activity-list"></div>
                </div>
            </div>
        </section>

        <!-- Review queue view (detailed list) -->
        <section id="view-queue" class="view">
            <div class="view-header">
                <h2>Review Queue</h2>
                <div class="view-controls">
                    <select id="status-filter" aria-label="Filter by status">
                        <option value="all">All Statuses</option>
                        <option value="queued">Queued</option>
                        <option value="pending_review">Pending Review</option>
                        <option value="blocked">Blocked</option>
                    </select>
                </div>
            </div>
            <div id="full-queue-list" class="full-queue-list"></div>
            <div id="full-queue-empty" class="empty-state" style="display:none">
                <p>No units in the queue.</p>
            </div>
        </section>

        <!-- Dependency graph view (full-screen) -->
        <section id="view-graph" class="view">
            <div class="view-header">
                <h2>Dependency Graph</h2>
                <div class="view-controls">
                    <button id="btn-fit-graph" class="btn btn-sm">Fit to View</button>
                    <button id="btn-reset-graph" class="btn btn-sm">Reset Zoom</button>
                </div>
            </div>
            <div class="graph-container">
                <canvas id="graph-canvas-full"></canvas>
                <div class="graph-controls">
                    <button id="btn-fit-graph-full" class="btn btn-sm">Fit</button>
                    <button id="btn-reset-graph-full" class="btn btn-sm">Reset</button>
                </div>
                <div id="zoom-indicator" class="graph-zoom-indicator">100%</div>
            </div>
        </section>
    </main>

    <!-- Unit detail panel (slides in from the right) -->
    <aside id="detail-panel" class="detail-panel">
        <div class="detail-panel-header">
            <div class="detail-panel-title" id="detail-title">
                <span class="detail-unit-id"></span>
                <span class="detail-status-badge"></span>
            </div>
            <button id="detail-close" class="icon-btn" aria-label="Close detail panel">✕</button>
        </div>
        <div class="detail-panel-body" id="detail-body">
            <!-- Populated by JavaScript -->
        </div>
    </aside>

    <script src="app.js"></script>
</body>
</html>
