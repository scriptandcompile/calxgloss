[package]
name = "calxgloss-serialize"
version.workspace = true
edition.workspace = true
description = "Endianness and serialization detection: byte-swap call matching, bit-packing pattern recognition, magic-byte format sniffing"
license.workspace = true
repository.workspace = true

[dependencies]
calxgloss-ghidra = { path = "../../integrations/calxgloss-ghidra" }
calxgloss-prompts = { path = "../../integrations/calxgloss-prompts" }
calxgloss-types = { path = "../../shared/calxgloss-types" }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"

# `calxgloss-ghidra` and `calxgloss-prompts` back the decompiler fetches and
# the prompt-facing conversion the engine runs on; they are declared now so
# the manifest stays stable as the detectors land. Same allowance as
# `calxgloss-typesdb`, `calxgloss-typeinfer`, `calxgloss-algorithm`, and
# `calxgloss-memory`.
[lints.cargo]
unused_dependencies = "allow"
