[package]
name = "calxgloss-stringctx"
version.workspace = true
edition.workspace = true
description = "String and configuration context: nine-category string classification, per-function string mapping, format-string type inference"
license.workspace = true
repository.workspace = true

[dependencies]
calxgloss-ghidra = { path = "../../integrations/calxgloss-ghidra" }
calxgloss-prompts = { path = "../../integrations/calxgloss-prompts" }
calxgloss-types = { path = "../../shared/calxgloss-types" }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
tempfile = "3"

# `calxgloss-ghidra` and `regex` back the decompiler fetches and the pattern
# matching the classification and mapping engines run; they are declared now
# so the manifest stays stable as the engines land. Same allowance as
# `calxgloss-typesdb`, `calxgloss-typeinfer`, `calxgloss-algorithm`,
# `calxgloss-memory`, `calxgloss-sync`, `calxgloss-callback`, and
# `calxgloss-controlflow`.
[lints.cargo]
unused_dependencies = "allow"
