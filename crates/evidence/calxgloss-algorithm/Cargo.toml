[package]
name = "calxgloss-algorithm"
version.workspace = true
edition.workspace = true
description = "Algorithm recognition: control flow signature matching, string-guided algorithm hints, callback pattern detection"
license.workspace = true
repository.workspace = true

[dependencies]
calxgloss-ghidra = { path = "../../integrations/calxgloss-ghidra" }
calxgloss-prompts = { path = "../../integrations/calxgloss-prompts" }
calxgloss-types = { path = "../../shared/calxgloss-types" }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
tempfile = "3"

# `calxgloss-ghidra` and `regex` back the decompiler and string fetches and
# the pattern matching the recognition detectors run on; they are declared
# now so the manifest stays stable as the detectors land. Same allowance as
# `calxgloss-typesdb` and `calxgloss-typeinfer`.
[lints.cargo]
unused_dependencies = "allow"
