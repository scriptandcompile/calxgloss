[package]
name = "calxgloss-typesdb"
version.workspace = true
edition.workspace = true
description = "Data structure recovery: decompiler type library scanning, vtable detection, string-guided struct inference"
license.workspace = true
repository.workspace = true

[dependencies]
calxgloss-decomp = { path = "../../integrations/calxgloss-decomp" }
# The Kuna engine: the recovery engines' default source (issue #214).
calxgloss-kuna = { path = "../../integrations/calxgloss-kuna" }
calxgloss-prompts = { path = "../../integrations/calxgloss-prompts" }
calxgloss-types = { path = "../../shared/calxgloss-types" }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
tempfile = "3"
calxgloss-testfixtures = { path = "../../integrations/calxgloss-testfixtures" }

# `calxgloss-types` and `regex` back the type conversions and string
# clustering the recovery engines need; they are declared now so the manifest
# stays stable as the engines land. Same allowance as `calxgloss-web`.
[lints.cargo]
unused_dependencies = "allow"
