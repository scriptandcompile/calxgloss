[package]
name = "calxgloss-callgraph"
version.workspace = true
edition.workspace = true
description = "Call graph analysis: root/leaf detection, translation ordering, context enrichment"
license.workspace = true
repository.workspace = true

[dependencies]
calxgloss-decomp = { path = "../../integrations/calxgloss-decomp" }
calxgloss-types = { path = "../../shared/calxgloss-types" }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
calxgloss-analysis = { path = "../calxgloss-analysis" }
# The Kuna engine and the fixture target, for the test proving the builder
# reads the seam's Kuna path with no engine special case (issue #207).
calxgloss-kuna = { path = "../../integrations/calxgloss-kuna" }
calxgloss-testfixtures = { path = "../../integrations/calxgloss-testfixtures" }
# The orderer tests pin the state-sharing rule end to end against the
# real shared-globals index records and the persisted document — a
# dev-only edge, since globalstate reaches callgraph through prompts
# (issue #256).
calxgloss-globalstate = { path = "../calxgloss-globalstate" }
# A temp workspace holding a hand-written global-state document, for the
# orderer test that consumes the persisted index (issue #256).
tempfile = "3"
