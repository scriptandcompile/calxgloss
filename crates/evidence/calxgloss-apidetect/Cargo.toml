[package]
name = "calxgloss-apidetect"
version.workspace = true
edition.workspace = true
description = "Library & API identification: import-table extraction, library-to-Rust-crate mapping, per-function API summaries"
license.workspace = true
repository.workspace = true

[dependencies]
calxgloss-callgraph = { path = "../calxgloss-callgraph" }
calxgloss-ghidra = { path = "../../integrations/calxgloss-ghidra" }
calxgloss-prompts = { path = "../../integrations/calxgloss-prompts" }
calxgloss-types = { path = "../../shared/calxgloss-types" }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"

# `calxgloss-ghidra` and `calxgloss-callgraph` back the import listing and the
# call-graph traversal the scan runs on; they are declared now so the manifest
# stays stable as the detectors land. Same allowance as `calxgloss-typesdb`,
# `calxgloss-typeinfer`, `calxgloss-algorithm`, and `calxgloss-memory`.
[lints.cargo]
unused_dependencies = "allow"
