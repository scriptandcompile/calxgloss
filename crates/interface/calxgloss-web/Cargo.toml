[package]
name = "calxgloss-web"
version.workspace = true
edition.workspace = true
description = "Web review UI — API layer for the review dashboard"
license.workspace = true
repository.workspace = true

[dependencies]
calxgloss-types = { path = "../../shared/calxgloss-types" }
calxgloss-git = { path = "../../pipeline/calxgloss-git" }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# --- Optional dependencies (post-MVP) ---
# Enable with: cargo build --features server

axum = { version = "0.8", optional = true, features = ["ws"] }
axum-extra = { version = "0.10", optional = true, features = ["erased-json", "query"] }
calxgloss-reports = { path = "../calxgloss-reports", optional = true }
calxgloss-kuna = { path = "../../integrations/calxgloss-kuna", optional = true }
calxgloss-translator = { path = "../../pipeline/calxgloss-translator", optional = true }
calxgloss-verify = { path = "../../pipeline/calxgloss-verify", optional = true }
calxgloss-llm = { path = "../../integrations/calxgloss-llm", optional = true }
calxgloss-pal = { path = "../../integrations/calxgloss-pal", optional = true }
git2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
uuid = { version = "1.0", features = ["v4"], optional = true }
anyhow = { workspace = true, optional = true }
sysinfo = { workspace = true, optional = true }

[features]
default = []
# Enables the axum HTTP server for serving the review dashboard API and static frontend.
server = [
    "dep:axum",
    "dep:axum-extra",
    "dep:calxgloss-reports",
    "dep:calxgloss-kuna",
    "dep:calxgloss-translator",
    "dep:calxgloss-verify",
    "dep:calxgloss-llm",
    "dep:calxgloss-pal",
    "dep:git2",
    "dep:thiserror",
    "dep:tokio",
    "dep:futures-util",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:uuid",
    "dep:anyhow",
    "dep:sysinfo",
]

[dev-dependencies]
tempfile = "3"
# The fixture target binary the engine=kuna e2e scan runs against; the
# reachability test below keeps that wiring honest.
calxgloss-testfixtures = { path = "../../integrations/calxgloss-testfixtures" }
# The engine=kuna e2e scan (issue #212): the seam, the Kuna engine behind
# it, and the type-database scan whose record the run persists.
calxgloss-ghidra = { path = "../../integrations/calxgloss-ghidra" }
calxgloss-kuna = { path = "../../integrations/calxgloss-kuna" }
calxgloss-typesdb = { path = "../../evidence/calxgloss-typesdb" }
reqwest = { workspace = true, features = ["json", "stream"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { workspace = true }
urlencoding = "2"
# WebSocket client for the live-push e2e tests (same version axum's ws feature uses).
tokio-tungstenite = "0.29"
# Headless Chrome — only needed for the E2E browser test.
# The test is gated behind #[ignore] because Chrome must be
# installed on the machine.  It is kept here so CI can run it.
headless_chrome = "1.0.18"

[lints.cargo]
unused_dependencies = "allow"
