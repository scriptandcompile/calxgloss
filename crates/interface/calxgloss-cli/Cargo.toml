[package]
name = "calxgloss-cli"
version.workspace = true
edition.workspace = true
description = "CLI binary — wires all Calxgloss crates together"
license.workspace = true
repository.workspace = true

[dependencies]
calxgloss = { path = "../../calxgloss" }
calxgloss-decomp = { path = "../../integrations/calxgloss-decomp" }
calxgloss-analysis = { path = "../../evidence/calxgloss-analysis" }
calxgloss-testgen = { path = "../../pipeline/calxgloss-testgen" }
calxgloss-translator = { path = "../../pipeline/calxgloss-translator" }
calxgloss-typesdb = { path = "../../evidence/calxgloss-typesdb" }
calxgloss-typeinfer = { path = "../../evidence/calxgloss-typeinfer" }
calxgloss-algorithm = { path = "../../evidence/calxgloss-algorithm" }
calxgloss-memory = { path = "../../evidence/calxgloss-memory" }
calxgloss-libmatch = { path = "../../evidence/calxgloss-libmatch" }
calxgloss-bdiff = { path = "../../evidence/calxgloss-bdiff" }
calxgloss-sync = { path = "../../evidence/calxgloss-sync" }
calxgloss-globalstate = { path = "../../evidence/calxgloss-globalstate" }
calxgloss-consts = { path = "../../evidence/calxgloss-consts" }
calxgloss-stringctx = { path = "../../evidence/calxgloss-stringctx" }
calxgloss-callback = { path = "../../evidence/calxgloss-callback" }
calxgloss-controlflow = { path = "../../evidence/calxgloss-controlflow" }
calxgloss-apidetect = { path = "../../evidence/calxgloss-apidetect" }
calxgloss-serialize = { path = "../../evidence/calxgloss-serialize" }
calxgloss-errhandling = { path = "../../evidence/calxgloss-errhandling" }
calxgloss-floatsimd = { path = "../../evidence/calxgloss-floatsimd" }
calxgloss-verify = { path = "../../pipeline/calxgloss-verify" }
calxgloss-types = { path = "../../shared/calxgloss-types" }
calxgloss-git = { path = "../../pipeline/calxgloss-git" }
calxgloss-reports = { path = "../calxgloss-reports" }
calxgloss-llm = { path = "../../integrations/calxgloss-llm" }
calxgloss-pal = { path = "../../integrations/calxgloss-pal" }
calxgloss-config = { path = "../../shared/calxgloss-config" }
calxgloss-kuna = { path = "../../integrations/calxgloss-kuna" }
clap = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
tracing = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
git2 = { workspace = true }

calxgloss-web = { path = "../calxgloss-web", features = ["server"] }

[dev-dependencies]
tempfile = "3"
calxgloss-testfixtures = { path = "../../integrations/calxgloss-testfixtures" }
